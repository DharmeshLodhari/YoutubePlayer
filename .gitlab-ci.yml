image: cirrusci/flutter:stable

stages:
  - build
#  - analyze
#  - test

before_script:
  - flutter pub get
  - flutter clean


build: #Job name
  stage: build # Stage name

  script:
    - flutter build apk
  artifacts:
    paths:
      - build/app/outputs/apk/release/app-release.apk
  tags:
    - flutter

