image: cirrusci/flutter:1.22.5

stages:
  - Test
  - Build Android

before_script:
  - flutter pub get
  - flutter clean

test:
  stage: Test
  script:
    - flutter test

  tags:
    - flutter


build:
  stage: Build Android

  before_script:
    - touch android/key.properties
    - cat $KEYFILE >> android/key.properties

  script:
    - flutter build apk

  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk

  tags:
    - flutter

