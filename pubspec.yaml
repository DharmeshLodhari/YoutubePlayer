name: Slydo
description: The slydo application.
version: 1.0.0+4

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl_translation: ^0.17.1
  flutter_spinkit: ^4.0.0
  http: ^0.12.0+2
  provider: ^4.0.0
  sqflite: ^1.2.0
  path_provider: ^1.5.1
  qr_code_scanner: ^0.0.13
  page_view_indicators: ^1.3.1
  firebase_messaging:
  image_picker: ^0.6.1+4
  mime_type: ^0.2.5
  firebase_crashlytics:
  firebase_core: ^0.4.0+9
  cached_network_image:
  toast:
  shared_preferences:
  passcode_screen: ^1.0.2
  location: ^2.3.5
  flutter_slidable: ^0.5.4
  cached_listview: ^2.0.0
  device_info: ^0.4.1+5
  pull_to_refresh: ^1.5.7
  connectivity: ^0.4.8+5
  uuid: ^2.0.4
  intl: ^0.15.8
  autocomplete_textfield: ^1.7.3
  popup_menu: ^1.0.5
  flappy_search_bar: ^1.7.2
  package_info: ^0.4.0+16
  maps_launcher: ^1.2.0
  rflutter_alert: ^1.0.2
  devicelocale: ^0.2.3
  flip_card: ^0.4.4
  charts_flutter: ^0.9.0
  flutter_money_formatter: ^0.8.3
  badges: ^1.1.1
  flutter_credit_card: ^0.1.3
  share: ^0.6.4+2
  carousel_slider: ^2.1.0
  page_transition: ^1.1.5
  pinput: ^0.2.4
  overlay_container: ^0.0.4+1
  sms_otp_auto_verify: ^1.2.2
  printing: ^3.6.1
  pdf: ^1.11.2


dependency_overrides:
  intl: ^0.16.0


flutter_icons:
  android: "launcher_icon"
  image_path_ios: "assets/images/appIcon/appIcon_IOS.png"
  image_path_android: "assets/images/appIcon/appIcon_IOS.png"
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.7.3"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/flags/
    - assets/images/category/
    - assets/images/intro_images/
    - assets/fonts/
    - assets/images/appIcon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: CircularStd
      fonts:
        - asset: assets/fonts/CircularStd-Medium.otf
        - asset: assets/fonts/CircularStd-Bold.otf
          weight: 700

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800

    - family:  SlydoAppIcon
      fonts:
        - asset: assets/fonts/SlydoAppIcon.ttf

  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
