name: Slydo
description: The slydo application.
version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl_translation: ^0.17.1
  flutter_spinkit: ^4.0.0
  http: ^0.12.0+2
  provider: ^4.0.0
  sqflite: ^1.2.0
  path_provider: ^1.5.1
  qr_code_scanner: ^0.0.12
  introduction_screen: ^1.0.8
  firebase_messaging:
  image_picker: ^0.6.1+4
  mime_type: ^0.2.5
  firebase_crashlytics:
  firebase_core: ^0.4.0+9
  cached_network_image:
  toast:
  shared_preferences:
  passcode_screen: ^1.0.2
  location: ^2.3.5
  flutter_slidable: ^0.5.4
  cached_listview: ^2.0.0
  device_info: ^0.4.1+5
  pull_to_refresh: ^1.5.7
#  connectivity: ^0.4.8+2
#  connectivity: 0.4.4+1
  connectivity: ^0.4.8+5
  flutter_local_notifications: ^0.6.0
  uuid: ^2.0.4
  intl: ^0.15.8
  autocomplete_textfield: ^1.7.3
  popup_menu: ^1.0.5
  flappy_search_bar: ^1.7.2
  package_info: ^0.4.0+16
  maps_launcher: ^1.2.0
  rflutter_alert: ^1.0.2
  devicelocale: ^0.2.3
  flip_card: ^0.4.4
  charts_flutter: ^0.9.0
  flutter_money_formatter: ^0.8.3
  badges: ^1.1.1
  flutter_credit_card: ^0.1.3

dependency_overrides:
  intl: ^0.16.0


flutter_icons:
  android: "launcher_icon"
  image_path_ios: "assets/images/icon_without_alpha.png"
  image_path_android: "assets/images/icon_with_blue_bg.png"
  adaptive_icon_background: "assets/images/blue_background.png"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  ios: true



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.7.3"


